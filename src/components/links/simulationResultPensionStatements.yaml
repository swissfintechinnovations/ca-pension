operationId: getPensionStatementsByDate
description: |
  Pension statement(s) of the insured person.
  The `personId` of the `pensionStatementBeforeChange` can be used as the `personId` path parameter.

  Example: `GET /insured-persons/JohnDoe_1234/statements`
parameters:
  personId: $response.body#/pensionStatementBeforeChange/personId
