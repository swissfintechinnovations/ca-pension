operationId: getPolicy
description: |
  Details of the selected policy.
  Any entry of the `policyIds` array can be used as the `policyId` path parameter.
  The expression below addresses the first entry; it applies to every entry alike.

  Example: `GET /policies/Pol_56789-2024`
parameters:
  policyId: $response.body#/policyIds/0
